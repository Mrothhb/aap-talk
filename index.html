<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d2a46">
<title>Talk · A&amp;AP</title>
<style>
  :root { --navy: #0d2a46; --ink: #1c2430; --muted: #66707c; --line: #d5dce4; --soft: #f2f6fb; --red: #c0392b; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         line-height: 1.45; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 18px calc(32px + env(safe-area-inset-bottom)); }
  header { text-align: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  header img { width: 96px; height: auto; display: block; margin: 0 auto 4px; }
  .brand { font-size: 22px; font-weight: 800; color: var(--navy); letter-spacing: 1.5px; }
  .brand-sub { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 1.2px; }
  h1 { font-size: 26px; color: var(--navy); margin: 18px 0 2px; text-align: center; font-weight: 700; }
  .order { text-align: center; color: var(--navy); font-weight: 600; font-size: 15px; margin: 0 0 6px; }
  .lead { text-align: center; font-size: 15px; margin: 6px auto 18px; max-width: 34em; }
  .mic-wrap { text-align: center; margin: 8px 0 6px; }
  #mic { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--navy); color: #fff;
         cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
         box-shadow: 0 4px 14px rgba(13, 42, 70, 0.28); -webkit-tap-highlight-color: transparent;
         touch-action: manipulation; transition: background 0.15s, transform 0.1s; }
  #mic:active { transform: scale(0.97); }
  #mic:focus-visible { outline: 3px solid #7fa6cc; outline-offset: 4px; }
  #mic svg { width: 44px; height: 44px; }
  #mic.on { background: var(--red); animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.45); }
                     100% { box-shadow: 0 0 0 22px rgba(192, 57, 43, 0); } }
  #state { text-align: center; font-size: 17px; font-weight: 600; color: var(--navy); margin: 10px 0 14px; min-height: 1.5em; }
  #state.on { color: var(--red); }
  .box { border: 1px solid var(--line); border-radius: 8px; background: var(--soft); padding: 2px; }
  .box:focus-within { border-color: var(--navy); }
  #text { width: 100%; min-height: 240px; border: 0; background: transparent; resize: vertical; padding: 12px;
          font: inherit; font-size: 18px; line-height: 1.5; color: var(--ink); outline: none; display: block; }
  #interim { color: #9aa3ad; font-style: italic; font-size: 17px; padding: 0 12px 10px; min-height: 1.6em; }
  .buttons { display: flex; gap: 10px; margin: 14px 0 8px; flex-wrap: wrap; }
  .buttons button { flex: 1 1 auto; font: inherit; font-size: 17px; font-weight: 600; padding: 14px 16px;
                    border-radius: 8px; cursor: pointer; touch-action: manipulation; }
  #send { background: var(--navy); color: #fff; border: 1px solid var(--navy); flex-basis: 55%; }
  #copy { background: #fff; color: var(--navy); border: 1px solid var(--navy); }
  #clear { background: #fff; color: var(--muted); border: 1px solid var(--line); flex: 0 0 auto; }
  #note { min-height: 1.4em; font-size: 15px; color: var(--navy); margin: 4px 0 10px; }
  #note.warn { color: var(--red); }
  .small { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 18px; }
</style>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line>
      </svg>
    </button>
  </div>
  <div id="state" role="status" aria-live="polite">Tap the microphone and talk</div>

  <div class="box">
    <textarea id="text" aria-label="Your words" placeholder="Your words show up here. You can fix anything by typing."></textarea>
    <div id="interim" aria-hidden="true"></div>
  </div>

  <div class="buttons">
    <button id="send" type="button">Send</button>
    <button id="copy" type="button">Copy text</button>
    <button id="clear" type="button" aria-label="Clear the text">Clear</button>
  </div>
  <div id="note" role="status" aria-live="polite"></div>

  <p class="small">Your browser turns your voice into text. Nothing is sent until you press Send.</p>
</main>

<script>
(function () {
  "use strict";
  var TO = "orders@appraisalpartners.net";
  var MAX_LINK = 1900;

  var $ = function (id) { return document.getElementById(id); };
  var mic = $("mic"), stateEl = $("state"), text = $("text"), interimEl = $("interim"), note = $("note");

  // Order code from ?o= (letters, digits and dashes only; nothing else is read from the URL)
  var order = "";
  try {
    var o = new URLSearchParams(window.location.search).get("o") || "";
    o = o.trim().toUpperCase();
    if (/^[A-Z0-9][A-Z0-9-]{0,23}$/.test(o)) order = o;
  } catch (e) { order = ""; }
  if (order) {
    $("order").textContent = "Order " + order;
    $("order").hidden = false;
    document.title = "Talk · " + order + " · A&AP";
  }

  // Keep a draft on this device only, so switching to the email app and back never loses the words
  var KEY = "aap-talk:" + (order || "none");
  function save() { try { localStorage.setItem(KEY, text.value); } catch (e) {} }
  try { text.value = localStorage.getItem(KEY) || ""; } catch (e) {}
  text.addEventListener("input", save);

  function setState(msg, on) {
    stateEl.textContent = msg;
    stateEl.className = on ? "on" : "";
    mic.className = on ? "on" : "";
    mic.setAttribute("aria-pressed", on ? "true" : "false");
    mic.setAttribute("aria-label", on ? "Stop listening" : "Start listening");
  }
  function say(msg, warn) { note.textContent = msg || ""; note.className = warn ? "warn" : ""; }

  function append(words) {
    words = (words || "").trim();
    if (!words) return;
    var v = text.value;
    var sep = (!v || /\s$/.test(v)) ? "" : " ";
    if (v && /[.!?]\s*$/.test(v)) words = words.charAt(0).toUpperCase() + words.slice(1);
    text.value = v + sep + words;
    text.scrollTop = text.scrollHeight;
    save();
  }

  // Speech
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var isAndroid = /Android/i.test(navigator.userAgent);
  var rec = null, wanted = false, running = false, pending = "";

  function noSpeech(msg) {
    wanted = false;
    setState(msg || "Tap the box and use your keyboard's microphone", false);
    text.focus();
  }

  function startRec() {
    rec = new SR();
    rec.lang = "en-US";
    rec.interimResults = true;
    // Android Chrome repeats earlier words in continuous mode, so there we listen phrase by phrase and restart
    rec.continuous = !isAndroid;
    rec.maxAlternatives = 1;
    rec.onstart = function () { running = true; setState("Listening...", true); };
    rec.onresult = function (ev) {
      var interim = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var r = ev.results[i];
        if (r.isFinal) append(r[0].transcript);
        else interim += r[0].transcript;
      }
      pending = interim;
      interimEl.textContent = interim;
    };
    rec.onerror = function (ev) {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        noSpeech("Microphone is blocked. Allow it for this page, or tap the box and use your keyboard's microphone");
      } else if (ev.error === "audio-capture") {
        noSpeech("No microphone found. Tap the box and use your keyboard's microphone");
      } else if (ev.error === "network") {
        noSpeech("Speech needs a connection. Tap the box and use your keyboard's microphone");
      }
      // "no-speech" and "aborted": onend decides whether to keep going
    };
    rec.onend = function () {
      running = false;
      if (pending) { append(pending); pending = ""; }     // keep words the browser never marked final
      interimEl.textContent = "";
      if (wanted) {
        try { startRec(); return; } catch (e) { wanted = false; }
      }
      if (stateEl.textContent === "Listening...") setState("Stopped", false);
    };
    rec.start();
  }

  mic.addEventListener("click", function () {
    say("");
    if (!SR) { noSpeech(); return; }
    if (wanted || running) {
      wanted = false;
      setState("Stopped", false);
      try { rec && rec.stop(); } catch (e) {}
      return;
    }
    wanted = true;
    setState("Listening...", true);
    try { startRec(); } catch (e) { noSpeech(); }
  });

  if (!SR) {
    setState("Tap the box and use your keyboard's microphone", false);
    window.setTimeout(function () { text.focus(); }, 300);
  }

  // Copy and send
  function copyText(s) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(s).then(function () { return true; }, function () { return legacyCopy(s); });
    }
    return Promise.resolve(legacyCopy(s));
  }
  function legacyCopy(s) {
    var t = document.createElement("textarea");
    t.value = s;
    t.setAttribute("readonly", "");
    t.style.position = "fixed"; t.style.top = "0"; t.style.left = "-9999px"; t.style.fontSize = "16px";
    document.body.appendChild(t);
    t.select();
    t.setSelectionRange(0, s.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(t);
    return ok;
  }
  function fullText() {
    var words = (text.value + (pending ? " " + pending : "")).trim();
    return words;
  }
  function mailto(subject, body) {
    return "mailto:" + TO + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  $("copy").addEventListener("click", function () {
    var words = fullText();
    if (!words) { say("Nothing to copy yet.", true); return; }
    copyText(words).then(function (ok) {
      say(ok ? "Copied. Paste it anywhere." : "Could not copy. Press and hold in the box, Select All, then Copy.", !ok);
    });
  });

  $("send").addEventListener("click", function () {
    var words = fullText();
    if (!words) { say("Nothing to send yet. Tap the microphone and talk, or type in the box.", true); return; }
    if (wanted || running) { wanted = false; setState("Stopped", false); try { rec.stop(); } catch (e) {} }
    var subject = order ? "Talk · " + order : "Talk";
    var tail = order ? "\n\nOrder: " + order : "";
    var link = mailto(subject, words + tail);
    if (link.length <= MAX_LINK) {
      say("Opening your email. Press send there.");
      window.location.href = link;
      return;
    }
    copyText(words + tail).then(function (ok) {
      var body = (ok ? "My words are on the clipboard; pasting them below.\n\n"
                     : "My words are too long for one link; pasting them below.\n\n") + tail.trim();
      say(ok ? "Your words are copied. In the email, paste them into the message (press and hold, then Paste; or Ctrl+V), then send."
             : "Too long to send in one go and copying failed. Press and hold in the box, Select All, Copy, then paste into the email.", !ok);
      window.location.href = mailto(subject, body);
    });
  });

  $("clear").addEventListener("click", function () {
    if (!text.value) return;
    if (!window.confirm("Clear all the text?")) return;
    text.value = ""; pending = ""; interimEl.textContent = ""; save(); say("");
  });
})();
</script>
</body>
</html>
